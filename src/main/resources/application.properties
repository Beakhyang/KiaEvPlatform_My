spring.application.name=KiaEvPlatform
api.key=
api.key.ev-charger=${CHARGING_API_KEY:}
api.key.kakao-map=${KAKAO_API_KEY:}
api.key.chatbot=${GEMINI_API_KEY:${Gemini_API_Key:}}
chatbot.ai.model=${CHATBOT_AI_MODEL:gemini-2.5-flash}
charging.sync.enabled=${CHARGING_SYNC_ENABLED:false}
charging.sync.token=${CHARGING_SYNC_TOKEN:}

aws.region=${AWS_REGION:us-east-1}
aws.secretName=${AWS_SECRET_NAME:kiaev/prod/api-keys}

# ==========================================
# 1. MySQL DB connection
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/kiaevdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:1234}}

# ==========================================
# 2. JPA & Hibernate
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# ==========================================
# 3. Hibernate logs
# ==========================================
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:debug}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:trace}

# ==========================================
# 4. Server settings
# ==========================================
server.port=${PORT:8080}
server.servlet.session.timeout=${SESSION_TIMEOUT:1m}
