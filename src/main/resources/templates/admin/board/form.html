<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? '공지사항 수정' : '공지사항 작성'">공지사항 작성</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <script th:src="@{/js/admin-form-submit-state.js}" defer></script>
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/layout :: sidebar('board')}"></div>

    <main class="admin-content">
        <div class="page-header">
            <div>
                <h1 th:text="${isEdit} ? '공지사항 수정' : '공지사항 작성'">공지사항 작성</h1>
                <p>관리자 공지사항을 작성하거나 수정합니다.</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/admin/board/list}" class="btn btn-secondary">목록</a>
            </div>
        </div>

        <section class="panel">
            <form th:action="@{/admin/board/save}" method="post" class="form-grid" data-submit-state-form>
                <input type="hidden" name="boardNo" th:value="${board.boardNo}">
                <input type="hidden" name="boardType" value="NOTICE">

                <div class="field full">
                    <label>제목</label>
                    <input type="text" name="title" th:value="${board.title}" required>
                </div>

                <div class="field full">
                    <label>내용</label>
                    <textarea name="content" th:text="${board.content}" required></textarea>
                </div>

                <div class="field">
                    <label>우선순위</label>
                    <input type="number" name="priority" th:value="${board.priority != null ? board.priority : 0}" min="0">
                    <p class="form-help">숫자가 낮을수록 먼저 노출됩니다.</p>
                </div>

                <div class="field">
                    <label>노출 설정</label>
                    <div class="check-group">
                        <label class="check-option">
                            <input type="checkbox" name="isPinned" value="Y" th:checked="${board.isPinned == 'Y'}">
                            <span>상단 고정</span>
                        </label>

                        <label class="check-option">
                            <input type="checkbox" name="hidden" value="Y" th:checked="${board.hidden == 'Y'}">
                            <span>비공개</span>
                        </label>
                    </div>
                </div>

                <div class="field full form-actions">
                    <button type="submit" class="btn btn-primary"
                            th:attr="data-loading-text=${isEdit} ? '저장 중...' : '등록 중...'">저장</button>
                    <a th:href="@{/admin/board/list}" class="btn btn-secondary">취소</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
