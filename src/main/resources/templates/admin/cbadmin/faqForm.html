<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'FAQ 수정' : 'FAQ 등록'">FAQ 등록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/layout :: sidebar('chatbot')}"></div>

    <main class="admin-content">
        <div class="page-header">
            <div>
                <h1 th:text="${isEdit} ? 'FAQ 수정' : 'FAQ 등록'">FAQ 등록</h1>
                <p>후속 질문은 줄바꿈으로 여러 개를 입력하면 챗봇 추천 질문으로 연결됩니다.</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/admin/chatbot/faq/list}" class="btn btn-secondary">목록</a>
            </div>
        </div>

        <section class="panel">
            <form th:action="@{/admin/chatbot/faq/save}" method="post" class="form-grid">
                <input type="hidden" name="faqNo" th:value="${faq.faqNo}">

                <div class="field">
                    <label>카테고리</label>
                    <input type="text" name="category" th:value="${faq.category}" required placeholder="구매 상담">
                </div>
                <div class="field">
                    <label>노출 순서</label>
                    <input type="number" name="displayOrder" th:value="${faq.displayOrder != null ? faq.displayOrder : 0}" min="0">
                </div>
                <div class="field full">
                    <label>질문</label>
                    <input type="text" name="question" th:value="${faq.question}" required>
                </div>
                <div class="field full">
                    <label>답변</label>
                    <textarea name="answer" th:text="${faq.answer}" required></textarea>
                </div>
                <div class="field full">
                    <label>후속 질문</label>
                    <textarea name="followUpQuestions" th:text="${faq.followUpQuestions}" placeholder="차량 추천을 받고 싶어요&#10;보조금 안내를 받고 싶어요"></textarea>
                </div>
                <div class="field">
                    <label>노출 상태</label>
                    <select name="activeYn">
                        <option value="Y" th:selected="${faq.activeYn == 'Y'}">노출</option>
                        <option value="N" th:selected="${faq.activeYn == 'N'}">비노출</option>
                    </select>
                </div>

                <div class="field full form-actions">
                    <button type="submit" class="btn btn-primary">저장</button>
                    <a th:href="@{/admin/chatbot/faq/list}" class="btn btn-secondary">취소</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
