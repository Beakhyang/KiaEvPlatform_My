<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 로그인</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
<div class="login-page">
    <section class="login-card">
        <h1>관리자 로그인</h1>
        <p>전기차 홈페이지 운영 데이터를 관리하는 전용 관리자 페이지입니다.</p>

        <div class="error-box" th:if="${loginError}" th:text="${loginError}"></div>

        <form th:action="@{/admin/login}" method="post">
            <input type="text" name="adminId" placeholder="관리자 아이디" required>
            <input type="password" name="adminPw" placeholder="비밀번호" required>
            <button type="submit" class="btn btn-primary">로그인</button>
        </form>
    </section>
</div>
</body>
</html>
