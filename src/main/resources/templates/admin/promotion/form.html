<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? '프로모션 수정' : '프로모션 등록'">프로모션 등록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/layout :: sidebar('promotion')}"></div>

    <main class="admin-content">
        <div class="page-header">
            <div>
                <h1 th:text="${isEdit} ? '프로모션 수정' : '프로모션 등록'">프로모션 등록</h1>
                <p>이벤트 배너와 메인 팝업 노출 정보를 등록하고 수정합니다.</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/admin/promotion/list}" class="btn btn-secondary">목록</a>
            </div>
        </div>

        <section class="panel">
            <form th:action="@{/admin/promotion/save}" method="post" class="form-grid">
                <input type="hidden" name="id" th:value="${promotion.id}">

                <div class="field">
                    <label>유형</label>
                    <select name="type">
                        <option value="EVENT" th:selected="${promotion.type == 'EVENT' or promotion.type == 'DISCOUNT' or promotion.type == 'GIFT'}">이벤트</option>
                        <option value="POPUP" th:selected="${promotion.type == 'POPUP'}">팝업</option>
                    </select>
                </div>

                <div class="field">
                    <label>대상 모델</label>
                    <input type="text" name="targetModel" th:value="${promotion.targetModel}" placeholder="ALL 또는 EV6">
                </div>

                <div class="field full">
                    <label>제목</label>
                    <input type="text" name="title" th:value="${promotion.title}" required>
                </div>

                <div class="field full">
                    <label>부제목</label>
                    <input type="text" name="subTitle" th:value="${promotion.subTitle}" placeholder="짧은 소개 문구">
                </div>

                <div class="field">
                    <label>할인 금액</label>
                    <input type="number" name="discountAmount" th:value="${promotion.discountAmount != null ? promotion.discountAmount : 0}" min="0">
                </div>

                <div class="field">
                    <label>배너 순서</label>
                    <input type="number" name="bannerOrder" th:value="${promotion.bannerOrder != null ? promotion.bannerOrder : 0}" min="0">
                </div>

                <div class="field">
                    <label>시작일</label>
                    <input type="datetime-local" name="startDate" th:value="${promotion.startDate != null ? #temporals.format(promotion.startDate, 'yyyy-MM-dd''T''HH:mm') : ''}" required>
                </div>

                <div class="field">
                    <label>종료일</label>
                    <input type="datetime-local" name="endDate" th:value="${promotion.endDate != null ? #temporals.format(promotion.endDate, 'yyyy-MM-dd''T''HH:mm') : ''}" required>
                </div>

                <div class="field full">
                    <label>배너 이미지 경로</label>
                    <input type="text" name="bannerImageUrl" th:value="${promotion.bannerImageUrl}" placeholder="/images/promotion/sample.jpg">
                    <p class="form-help">메인 배너나 팝업에 사용할 이미지 경로를 입력합니다.</p>
                </div>

                <div class="field full">
                    <label>상세 내용</label>
                    <textarea name="content" th:text="${promotion.content}" required></textarea>
                </div>

                <div class="field full">
                    <label>노출 여부</label>
                    <div class="check-group">
                        <input type="hidden" name="active" value="false">
                        <label class="check-option">
                            <input type="checkbox" name="active" value="true" th:checked="${promotion.active}">
                            <span>활성화</span>
                        </label>
                    </div>
                </div>

                <div class="field full form-actions">
                    <button type="submit" class="btn btn-primary">저장</button>
                    <a th:href="@{/admin/promotion/list}" class="btn btn-secondary">취소</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
