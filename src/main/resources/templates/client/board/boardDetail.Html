<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기아 전기차 - 게시글 상세</title>
    <style>
        .container { width: 800px; margin: 120px auto; font-family: sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; }
        th { background-color: #f4f4f4; width: 15%; text-align: center; }
        .content-area { min-height: 300px; padding: 20px; border: 1px solid #ddd; margin-bottom: 20px; line-height: 1.6; white-space: pre-wrap; }
        .section-title { margin: 28px 0 12px; font-size: 22px; font-weight: 700; }
        .answer-wrap { border: 1px solid #d6dde8; background-color: #f8fbff; padding: 20px; margin-bottom: 20px; }
        .answer-meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; color: #516173; font-size: 14px; }
        .answer-content { line-height: 1.7; white-space: pre-wrap; color: #1f2937; }
        .answer-empty { border: 1px dashed #c8d1dd; background-color: #fafbfc; padding: 18px 20px; margin-bottom: 20px; color: #667085; }
        .btn-group { text-align: right; }
        .btn { display: inline-block; padding: 10px 15px; color: white; text-decoration: none; margin-left: 5px; font-size: 14px; border: none; cursor: pointer; }
        .btn-edit { background-color: #0d6efd; }
        .btn-delete { background-color: #dc3545; }
        .btn-list { background-color: #6c757d; }
        .inline-form { display: inline; }

        @media (max-width: 900px) {
            .board-page .container {
                width: 100% !important;
                margin: 0 !important;
                padding: 190px 16px 50px !important;
                box-sizing: border-box !important;
            }

            .board-page h2 {
                font-size: 24px !important;
                line-height: 1.25 !important;
                margin: 0 0 18px !important;
            }

            .board-page table,
            .board-page tbody,
            .board-page tr,
            .board-page th,
            .board-page td {
                display: block !important;
                width: 100% !important;
                box-sizing: border-box !important;
                white-space: normal !important;
            }

            .board-page table {
                border: 1px solid #ddd !important;
                border-radius: 14px !important;
                overflow: hidden !important;
                margin-bottom: 18px !important;
            }

            .board-page tr {
                border-bottom: 1px solid #e8e8e8 !important;
            }

            .board-page tr:last-child {
                border-bottom: 0 !important;
            }

            .board-page th,
            .board-page td {
                border: 0 !important;
                text-align: left !important;
                font-size: 13px !important;
                line-height: 1.45 !important;
                padding: 9px 12px !important;
            }

            .board-page th {
                background: #f4f4f4 !important;
                font-weight: 700 !important;
            }

            .board-page .section-title {
                font-size: 20px !important;
                margin: 24px 0 10px !important;
            }

            .board-page .content-area,
            .board-page .answer-wrap,
            .board-page .answer-empty {
                width: 100% !important;
                box-sizing: border-box !important;
                padding: 16px !important;
                font-size: 14px !important;
                line-height: 1.65 !important;
                white-space: pre-wrap !important;
                word-break: keep-all !important;
                overflow-wrap: anywhere !important;
            }

            .board-page .content-area {
                min-height: 220px !important;
            }

            .board-page .answer-meta {
                flex-direction: column !important;
                gap: 4px !important;
                font-size: 13px !important;
            }

            .board-page .btn-group {
                display: flex !important;
                flex-direction: column !important;
                gap: 8px !important;
                text-align: center !important;
            }

            .board-page .inline-form,
            .board-page .btn {
                display: block !important;
                width: 100% !important;
                margin-left: 0 !important;
                text-align: center !important;
                box-sizing: border-box !important;
            }
        }
    </style>
</head>
<body class="board-page board-detail-page">
<th:block th:replace="~{common/header :: header}"></th:block>

<div class="container">
    <h2>게시글 상세 보기</h2>

    <table>
        <tbody>
            <tr>
                <th>제목</th>
                <td colspan="3" th:text="${board.title}">게시글 제목</td>
            </tr>
            <tr>
                <th>분류</th>
                <td th:text="${board.boardType == 'NOTICE' ? '공지사항' : board.boardType == 'INQUIRY' ? '일반문의' : board.boardType == 'EV_INQUIRY' ? '전기차문의' : board.boardType == 'CS_CENTER' ? '고객센터' : board.boardType}">문의글</td>
                <th>작성일</th>
                <td th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}">2026-04-13 16:50</td>
            </tr>
            <tr>
                <th>조회수</th>
                <td th:text="${board.viewCount}">0</td>
                <th th:text="${board.noticeYn == 'Y' ? '게시글 유형' : '답변상태'}">답변상태</th>
                <td th:text="${board.noticeYn == 'Y' ? '공지사항' : (#strings.isEmpty(board.answerContent) ? '답변 대기' : '답변 완료')}">답변 대기</td>
            </tr>
        </tbody>
    </table>

    <div class="section-title">문의 내용</div>
    <div class="content-area" th:text="${board.content}">
        게시글 내용
    </div>

    <th:block th:if="${board.noticeYn != 'Y'}">
        <div class="section-title">관리자 답변</div>
        <div class="answer-wrap" th:if="${!#strings.isEmpty(board.answerContent)}">
            <div class="answer-meta">
                <span>작성자: GM</span>
                <span th:text="${board.answerDate != null ? #temporals.format(board.answerDate, 'yyyy-MM-dd HH:mm') : '-'}">2026-04-20 10:30</span>
            </div>
            <div class="answer-content" th:text="${board.answerContent}">관리자 답변 내용</div>
        </div>
        <div class="answer-empty" th:if="${#strings.isEmpty(board.answerContent)}">
            아직 등록된 관리자 답변이 없습니다.
        </div>
    </th:block>

    <div class="btn-group">
        <a th:if="${isAuthor}" th:href="@{/board/edit(boardNo=${board.boardNo})}" class="btn btn-edit">수정</a>
        <form th:if="${isAuthor}" th:action="@{/board/delete}" method="post" class="inline-form">
            <input type="hidden" name="boardNo" th:value="${board.boardNo}">
            <button type="submit" class="btn btn-delete" onclick="return confirm('게시글을 삭제하시겠습니까?');">삭제</button>
        </form>
        <a th:href="@{/board/list}" class="btn btn-list">목록으로</a>
    </div>
</div>
<th:block th:replace="~{common/footer :: footer}"></th:block>
</body>
</html>
