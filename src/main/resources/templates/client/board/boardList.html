<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기아 전기차 - 문의게시판</title>
<style>
/* 화면을 조금 예쁘게 보이게 해주는 간단한 CSS 입니다 */
table {
	width: 100%;
	border-collapse: collapse;
	margin-top: 20px;
}

th, td {
	border: 1px solid #ddd;
	padding: 10px;
	text-align: center;
}

th {
	background-color: #f4f4f4;
}

.title-td {
	text-align: left;
}

a {
	text-decoration: none;
	color: #333;
}

a:hover {
	text-decoration: underline;
	color: #007bff;
}

.btn {
	display: inline-block;
	margin-top: 10px;
	padding: 10px 15px;
	background-color: #000;
	color: #fff;
	text-decoration: none;
}

@media (max-width: 900px) {
	.board-page > div[style*="width: 800px"] {
		width: 100% !important;
		margin: 0 !important;
		padding: 190px 10px 50px !important;
		box-sizing: border-box !important;
	}

	.board-page h2 {
		font-size: 22px !important;
		line-height: 1.25 !important;
		margin: 0 0 14px !important;
	}

	.board-page table {
		display: table !important;
		width: 100% !important;
		table-layout: fixed !important;
		margin-top: 0 !important;
		border-collapse: collapse !important;
		box-sizing: border-box !important;
		overflow: visible !important;
	}

	.board-page thead {
		display: table-header-group !important;
	}

	.board-page tbody {
		display: table-row-group !important;
	}

	.board-page tr {
		display: table-row !important;
	}

	.board-page th,
	.board-page td {
		display: table-cell !important;
		border: 1px solid #ddd !important;
		padding: 6px 3px !important;
		text-align: center !important;
		font-size: 10.5px !important;
		line-height: 1.35 !important;
		letter-spacing: -0.04em !important;
		vertical-align: middle !important;
		white-space: normal !important;
		word-break: keep-all !important;
		overflow-wrap: anywhere !important;
	}

	.board-page th:nth-child(1),
	.board-page td:nth-child(1) {
		width: 11% !important;
	}

	.board-page th:nth-child(2),
	.board-page td:nth-child(2) {
		width: 17% !important;
	}

	.board-page th:nth-child(3),
	.board-page td:nth-child(3) {
		width: 36% !important;
	}

	.board-page th:nth-child(4),
	.board-page td:nth-child(4) {
		width: 12% !important;
	}

	.board-page th:nth-child(5),
	.board-page td:nth-child(5) {
		width: 24% !important;
	}

	.board-page .title-td {
		text-align: left !important;
	}

	.board-page .title-td a {
		display: block;
		font-size: 10.5px !important;
		line-height: 1.35 !important;
		word-break: keep-all;
		overflow-wrap: anywhere;
	}

	.board-page .btn {
		width: 100%;
		text-align: center;
		box-sizing: border-box;
	}
}
</style>
</head>
<body class="board-page board-list-page">
	<th:block th:replace="~{common/header :: header}"></th:block>
	<div style="width: 800px; margin: 120px auto 50px;">
		<h2> 문의 게시판</h2>

		<table>
			<thead>
				<tr>
					<th width="10%">번호</th>
					<th width="15%">분류</th>
					<th width="45%">제목</th>
					<th width="10%">조회수</th>
					<th width="20%">작성일</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="board : ${boardList}">
					<td th:text="${board.boardNo}">1</td>
					<td th:text="${board.boardType == 'NOTICE' ? '공지사항' : board.boardType == 'INQUIRY' ? '일반문의' : board.boardType == 'EV_INQUIRY' ? '전기차문의' : board.boardType == 'CS_CENTER' ? '고객센터' : board.boardType}">문의글</td>
					<td class="title-td"><a
						th:href="@{/board/detail(boardNo=${board.boardNo})}"
						th:text="${board.title}">게시글 제목입니다.</a></td>
					<td th:text="${board.viewCount}">0</td>
					<td
						th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}">2026-03-26</td>
				</tr>
			</tbody>
		</table>

		<!-- 페이지 네비게이션 -->
		<div style="text-align: center; margin-top: 20px;">
			<!-- 이전 페이지 -->
			<span th:if="${boardPage.hasPrevious()}"> <a
				th:href="@{|/board/list?page=${boardPage.number - 1}&size=${boardPage.size}|}">이전</a>
			</span>

			<!-- 페이지 번호 -->
			<span th:each="i : ${#numbers.sequence(0, boardPage.totalPages - 1)}">
				<a th:href="@{|/board/list?page=${i}&size=${boardPage.size}|}"
				th:text="${i + 1}">1</a>
			</span>

			<!-- 다음 페이지 -->
			<span th:if="${boardPage.hasNext()}"> <a
				th:href="@{|/board/list?page=${boardPage.number + 1}&size=${boardPage.size}|}">다음</a>
			</span>
		</div>

		<div style="text-align: right;">
			<a th:href="@{/board/write}" class="btn">글쓰기</a>
		</div>
	</div>
	<th:block th:replace="~{common/footer :: footer}"></th:block>
</body>
</html>
