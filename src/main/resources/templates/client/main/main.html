<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIA EV - 메인</title>
<!-- 폰트 추가 (가독성 향상) -->
<link rel="stylesheet" as="style" crossorigin
	href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
body {
	font-family: 'Pretendard', sans-serif;
	margin: 0;
	padding: 0;
	background-color: #ffffff;
	overflow-x: hidden;
}

* {
	box-sizing: border-box;
}

.main-container {
	width: min(1200px, calc(100% - 40px));
	margin: 0 auto;
	min-height: 800px;
	padding-top: 130px;
	padding-bottom: 100px;
}

/* --- 프로모션 슬라이드 스타일 --- */
.promo-container {
	width: 100%;
	height: 450px;
	background: #05141f;
	border-radius: 25px;
	margin-bottom: 80px;
	position: relative;
	overflow: hidden;
	box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

.promo-slider {
	display: flex;
	height: 100%;
	transition: transform 0.5s ease-out;
}

.promo-slide {
	min-width: 100%;
	height: 100%;
	display: flex;
	align-items: center;
	justify-content: center;
	text-align: center;
	color: #fff;
	padding: 0 120px;
	box-sizing: border-box;
	cursor: pointer;
}

.promo-title {
	font-size: 52px;
	font-weight: 800;
	margin: 0;
	line-height: 1.2;
	word-break: keep-all;
	overflow-wrap: anywhere;
}

.promo-description {
	font-size: 20px;
	color: #999;
	margin: 25px 0 40px;
	line-height: 1.55;
	word-break: keep-all;
	overflow-wrap: anywhere;
}

.promo-badge {
	display: inline-block;
	background: #fff;
	color: #05141f;
	padding: 12px 30px;
	border-radius: 50px;
	font-weight: 700;
}

.promo-empty-title {
	font-size: 40px;
	font-weight: 800;
	color: #fff;
	text-align: center;
	padding: 0 24px;
}

/* 슬라이드 화살표 */
.slide-btn {
	position: absolute;
	top: 50%;
	transform: translateY(-50%);
	background: none;
	border: none;
	color: #fff;
	font-size: 40px;
	cursor: pointer;
	opacity: 0.3;
	transition: 0.3s;
	z-index: 10;
}

.slide-btn:hover {
	opacity: 1;
}

.btn-prev { left: 30px; }
.btn-next { right: 30px; }

/* --- 라인업 카드 스타일 (기존 유지) --- */
.lineup-card {
	flex: 1;
	min-width: 0;
	background: #fff;
	border-radius: 20px;
	overflow: hidden;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
	transition: all 0.4s ease;
	cursor: pointer;
	border: 1px solid #f0f0f0;
}

.lineup-card:hover {
	transform: translateY(-10px);
	box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
}

.lineup-section {
	width: 100%;
}

.section-title {
	font-size: 28px;
	font-weight: 800;
	color: #05141f;
	margin-bottom: 40px;
	padding-left: 10px;
	border-left: 5px solid #05141f;
}

.lineup-grid {
	display: flex;
	flex-wrap: nowrap;
	justify-content: space-between;
	gap: 20px;
}

.img-box {
	width: 100%;
	height: 240px;
	background: #fdfdfd;
	overflow: hidden;
}

.img-box img {
	width: 100%;
	height: 100%;
	object-fit: cover; /* 이미지가 카드에 꽉 차도록 설정 */
	display: block;
	transition: 0.5s;
}

.lineup-card:hover .img-box img {
	transform: scale(1.05);
}

.info-box {
	padding: 25px;
	background: #fff;
}

.info-box h4 {
	margin: 0 0 10px 0;
	font-size: 22px;
	font-weight: 800;
	color: #05141f;
}

.price-label {
	margin: 0;
	font-size: 14px;
	color: #888;
}

.price-value {
	font-size: 19px;
	font-weight: 700;
	color: #05141f;
	margin-top: 5px;
}

.ai-widget-button {
	position: fixed;
	right: 32px;
	bottom: 32px;
	width: 86px;
	height: 86px;
	border: none;
	border-radius: 28px;
	background: linear-gradient(135deg, #05141f 0%, #0f6b63 100%);
	color: #ffffff;
	box-shadow: 0 18px 40px rgba(5, 20, 31, 0.28);
	cursor: pointer;
	z-index: 12000;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 6px;
	padding: 0;
	transition: transform 0.2s ease, box-shadow 0.2s ease;
	overflow: hidden;
}

.ai-widget-button:hover {
	transform: translateY(-4px);
	box-shadow: 0 24px 44px rgba(5, 20, 31, 0.34);
}

.ai-widget-button.has-custom-icon {
	background: transparent;
	border: none;
}

.ai-widget-icon {
	display: none;
	width: 100%;
	height: 100%;
	object-fit: cover;
	object-position: center;
	border-radius: inherit;
}

.ai-widget-button.has-custom-icon .ai-widget-icon {
	display: block;
}

.ai-widget-fallback {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 4px;
}

.ai-widget-fallback-strong {
	font-size: 24px;
	font-weight: 800;
	line-height: 1;
}

.ai-widget-fallback-label {
	font-size: 11px;
	font-weight: 700;
	letter-spacing: 0.08em;
}

.ai-widget-button.has-custom-icon .ai-widget-fallback {
	display: none;
}

.ai-widget-panel {
	position: fixed;
	right: 32px;
	top: 108px;
	bottom: 24px;
	width: min(460px, calc(100vw - 32px));
	background: #ffffff;
	border: 1px solid rgba(5, 20, 31, 0.08);
	border-radius: 28px;
	box-shadow: 0 28px 70px rgba(5, 20, 31, 0.18);
	z-index: 11999;
	display: none;
	flex-direction: column;
	overflow: hidden;
}

.ai-widget-panel.open {
	display: flex;
}

.ai-widget-header {
	padding: 18px 20px 14px;
	background: linear-gradient(135deg, #05141f 0%, #123a5a 58%, #2e7b6f 100%);
	color: #ffffff;
}

.ai-widget-header-top {
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: 12px;
	margin-bottom: 10px;
}

.ai-widget-title {
	margin: 0;
	font-size: 19px;
	font-weight: 800;
}

.ai-widget-subtitle {
	margin: 0;
	font-size: 12px;
	line-height: 1.5;
	color: rgba(255, 255, 255, 0.82);
}

.ai-widget-close {
	width: 36px;
	height: 36px;
	border: none;
	border-radius: 12px;
	background: rgba(255, 255, 255, 0.14);
	color: #ffffff;
	font-size: 18px;
	cursor: pointer;
}

.ai-widget-status {
	display: inline-flex;
	align-items: center;
	gap: 8px;
	padding: 7px 12px;
	border-radius: 999px;
	background: rgba(255, 255, 255, 0.12);
	font-size: 12px;
	font-weight: 700;
}

.ai-widget-status::before {
	content: "";
	width: 8px;
	height: 8px;
	border-radius: 50%;
	background: #8bffca;
	box-shadow: 0 0 0 5px rgba(139, 255, 202, 0.16);
}

.ai-widget-status.offline::before {
	background: #ffd36a;
	box-shadow: 0 0 0 5px rgba(255, 211, 106, 0.16);
}

.ai-widget-body {
	display: grid;
	grid-template-rows: minmax(0, 1fr) auto auto;
	flex: 1;
	min-height: 0;
	background: linear-gradient(180deg, #f6f8fb 0%, #ffffff 22%);
}

.ai-widget-messages {
	min-height: 0;
	padding: 18px 18px 16px;
	overflow-y: auto;
	scroll-behavior: smooth;
}

.ai-message {
	max-width: 88%;
	padding: 13px 14px;
	border-radius: 18px;
	margin-bottom: 12px;
	line-height: 1.55;
	font-size: 14px;
	white-space: pre-wrap;
	word-break: keep-all;
}

.ai-message.assistant {
	background: #ffffff;
	border: 1px solid #e3e8ef;
	color: #13202c;
	border-top-left-radius: 7px;
}

.ai-message.user {
	margin-left: auto;
	background: #05141f;
	border: 1px solid #05141f;
	color: #ffffff;
	border-top-right-radius: 7px;
}

.ai-message.typing {
	color: #607080;
}

.ai-widget-suggestions {
	display: flex;
	flex-wrap: nowrap;
	gap: 8px;
	padding: 0 18px 10px;
	overflow-x: auto;
	scrollbar-width: thin;
}

.ai-widget-panel.chatting .ai-widget-suggestions {
	display: none;
}

.ai-suggestion-chip {
	flex: 0 0 auto;
	border: 1px solid #d8e0ea;
	background: #ffffff;
	border-radius: 999px;
	padding: 9px 12px;
	font-size: 12px;
	font-weight: 700;
	color: #123049;
	cursor: pointer;
}

.ai-widget-footer {
	padding: 0 18px 16px;
}

.ai-widget-link {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	margin-bottom: 12px;
	font-size: 13px;
	font-weight: 700;
	color: #0f5b85;
	text-decoration: none;
}

.ai-widget-form {
	display: flex;
	gap: 10px;
	padding: 12px;
	background: #ffffff;
	border: 1px solid #dfe5ec;
	border-radius: 20px;
	box-shadow: 0 10px 25px rgba(5, 20, 31, 0.06);
}

.ai-widget-input {
	flex: 1;
	border: none;
	outline: none;
	font-size: 14px;
	font-family: inherit;
	background: transparent;
}

.ai-widget-send {
	width: 48px;
	height: 48px;
	border: none;
	border-radius: 16px;
	background: #05141f;
	color: #ffffff;
	font-size: 20px;
	cursor: pointer;
	flex-shrink: 0;
}

.ai-widget-send:disabled,
.ai-suggestion-chip:disabled {
	opacity: 0.55;
	cursor: default;
}

@media (max-width: 768px) {
	.main-container {
		width: 100%;
		min-height: auto;
		padding: 190px 16px 72px;
	}

	.promo-container {
		height: auto;
		min-height: 360px;
		border-radius: 24px;
		margin-bottom: 48px;
	}

	.promo-slide {
		min-height: 360px;
		padding: 52px 34px 76px;
	}

	.promo-title {
		font-size: clamp(24px, 6.6vw, 34px);
		letter-spacing: -0.04em;
	}

	.promo-description {
		font-size: clamp(14px, 3.8vw, 16px);
		line-height: 1.55;
		margin: 18px 0 26px;
	}

	.promo-badge {
		padding: 9px 18px;
		font-size: 13px;
	}

	.promo-empty-title {
		font-size: 24px;
		line-height: 1.3;
	}

	.slide-btn {
		top: auto;
		bottom: 20px;
		transform: none;
		width: 42px;
		height: 42px;
		border-radius: 50%;
		background: rgba(255, 255, 255, 0.14);
		font-size: 28px;
		opacity: 0.85;
	}

	.btn-prev {
		left: 22px;
	}

	.btn-next {
		right: 22px;
	}

	.section-title {
		font-size: 20px;
		margin-bottom: 22px;
	}

	.lineup-grid {
		flex-direction: column;
		gap: 18px;
	}

	.lineup-card {
		flex: none;
		width: 100%;
	}

	.lineup-card:hover {
		transform: none;
	}

	.img-box {
		height: 210px;
	}

	.info-box {
		padding: 18px;
	}

	.info-box h4 {
		font-size: 19px;
	}

	.price-value {
		font-size: 17px;
	}

	.ai-widget-button {
		right: 16px;
		bottom: 18px;
		width: 74px;
		height: 74px;
		border-radius: 22px;
	}

	.ai-widget-panel {
		right: 12px;
		left: 12px;
		top: 96px;
		bottom: 12px;
		width: auto;
		border-radius: 24px;
	}
}

@media (max-width: 480px) {
	.main-container {
		padding-left: 14px;
		padding-right: 14px;
	}

	.promo-container {
		min-height: 330px;
		border-radius: 20px;
	}

	.promo-slide {
		min-height: 330px;
		padding-left: 24px;
		padding-right: 24px;
	}

	.img-box {
		height: 190px;
	}
}
</style>
</head>

<script th:inline="javascript">
    // 정규식을 이용해 쿠키를 정확하게 찾아내는 함수
    function getCookie(name) {
        let matches = document.cookie.match(new RegExp(
            "(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
        ));
        return matches ? decodeURIComponent(matches[1]) : undefined;
    }

    // 0.5초 지연 후 실행 (브라우저 차단 정책 회피)
    setTimeout(function() {
        // 쿠키가 없을 때만 팝업 실행
        if (!getCookie("hidePopup")) {
            window.open('/popup', 'EV_Popup', 'width=420,height=500,top=100,left=100');
        } else {
            console.log("팝업 숨기기 상태입니다 (쿠키 있음)");
        }
    }, 500);

    /* 프로모션 슬라이드 로직 */
    let currentIndex = 0;
    const totalSlides = /*[[${#lists.size(promoList)}]]*/ 0;

    function moveSlide(direction) {
        const slider = document.getElementById('promoSlider');
        if (!slider || totalSlides <= 1) return;
        currentIndex += direction;
        if (currentIndex >= totalSlides) currentIndex = 0;
        if (currentIndex < 0) currentIndex = totalSlides - 1;
        slider.style.transform = `translateX(-${currentIndex * 100}%)`;
    }
</script>

<body>

	<!-- 고정 헤더 불러오기 -->
	<th:block th:replace="~{common/header :: header}"></th:block>

	<main class="main-container">

		<!-- [수정] 영역 1: 메인 프로모션 배너 (스토리보드 반영) -->
		<div class="promo-container">
			
			<!-- 프로모션 데이터가 있을 때 슬라이드 실행 -->
			<div th:if="${not #lists.isEmpty(promoList)}" id="promoSlider" class="promo-slider">
				<div th:each="promo : ${promoList}" class="promo-slide"
					 th:onclick="|location.href='@{/promotion/detail(id=${promo.id})}'|">
					<div>
						<h2 th:text="${promo.title}" class="promo-title">프로모션 제목</h2>
						<p th:text="${promo.content}" class="promo-description">간략한 정보 소개글</p>
						<div th:if="${promo.discountAmount != null and promo.discountAmount > 0}" 
							 class="promo-badge">
							최대 <span th:text="${#numbers.formatInteger(promo.discountAmount, 3, 'COMMA')}"></span>원 혜택
						</div>
					</div>
				</div>
			</div>

			<!-- 프로모션 데이터가 없을 때 표시할 기본 배너 -->
			<div th:unless="${not #lists.isEmpty(promoList)}" 
				 style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
				<h2 class="promo-empty-title">KIA EV: MOVEMENT THAT INSPIRES</h2>
			</div>

			<!-- 좌우 화살표 버튼 (데이터가 2개 이상일 때만 의미 있음) -->
			<th:block th:if="${#lists.size(promoList) > 1}">
				<button class="slide-btn btn-prev" onclick="moveSlide(-1)">❮</button>
				<button class="slide-btn btn-next" onclick="moveSlide(1)">❯</button>
			</th:block>
		</div>

		<!-- [유지] 영역 2: 라인업 섹션 -->
		<div class="lineup-section">
			<h3 class="section-title">
				KIA EV LINE-UP
			</h3>

			<div class="lineup-grid">
				<!-- 백엔드에서 받아온 3종 모델 반복 출력 -->
				<div th:each="car : ${carLineup}" class="lineup-card"
					 th:onclick="|location.href='@{/car/detail/{id}(id=${car.carNo})}'|">

					<div class="img-box">
						<img th:src="${car.imagePath}" th:alt="${car.modelName}">
					</div>

					<div class="info-box">
						<h4 th:text="${car.modelName}">모델명</h4>
						<p class="price-label">판매가</p>
						<div class="price-value">
							<span th:text="${#numbers.formatInteger(car.price, 3, 'COMMA')}">0</span>원 ~
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<!-- 푸터 불러오기 -->
	<th:block th:replace="~{common/footer :: footer}"></th:block>

	<button id="aiWidgetButton" class="ai-widget-button" type="button" aria-controls="aiWidgetPanel" aria-expanded="false">
		<img id="aiWidgetIcon" class="ai-widget-icon" th:src="@{/images/chatbot/chatbot-icon.png}" src="/images/chatbot/chatbot-icon.png" alt="AI 상담 아이콘" />
		<span class="ai-widget-fallback">
			<span class="ai-widget-fallback-strong">AI</span>
			<span class="ai-widget-fallback-label">TALK</span>
		</span>
	</button>

	<section id="aiWidgetPanel" class="ai-widget-panel" aria-label="AI 상담 위젯">
		<div class="ai-widget-header">
			<div class="ai-widget-header-top">
				<div>
					<h3 class="ai-widget-title">AI 상담</h3>
					<p class="ai-widget-subtitle">메인 화면에서 바로 차량 추천, 보조금, 시승 관련 질문을 남겨보세요.</p>
				</div>
				<button id="aiWidgetClose" class="ai-widget-close" type="button" aria-label="AI 상담 닫기">×</button>
			</div>
			<div id="aiWidgetStatus" class="ai-widget-status">연결 준비 중</div>
		</div>

		<div class="ai-widget-body">
			<div id="aiWidgetMessages" class="ai-widget-messages"></div>
			<div id="aiWidgetSuggestions" class="ai-widget-suggestions"></div>
			<div class="ai-widget-footer">
				<a class="ai-widget-link" th:href="@{/chatbot/main}">기존 FAQ 챗봇으로 이동</a>
				<form id="aiWidgetForm" class="ai-widget-form">
					<input id="aiWidgetInput" class="ai-widget-input" type="text" placeholder="예: EV6랑 EV9 중 가족용으로 뭐가 좋아?" autocomplete="off" />
					<button id="aiWidgetSend" class="ai-widget-send" type="submit" aria-label="메시지 보내기">↑</button>
				</form>
			</div>
		</div>
	</section>

	<script>
		(() => {
			const button = document.getElementById('aiWidgetButton');
			const widgetIcon = document.getElementById('aiWidgetIcon');
			const panel = document.getElementById('aiWidgetPanel');
			const closeButton = document.getElementById('aiWidgetClose');
			const status = document.getElementById('aiWidgetStatus');
			const messages = document.getElementById('aiWidgetMessages');
			const suggestions = document.getElementById('aiWidgetSuggestions');
			const form = document.getElementById('aiWidgetForm');
			const input = document.getElementById('aiWidgetInput');
			const sendButton = document.getElementById('aiWidgetSend');

			let initialized = false;
			let sending = false;
			let history = [];
			let typingMessage = null;

			function syncWidgetIconState() {
				const loaded = widgetIcon && widgetIcon.complete && widgetIcon.naturalWidth > 0;
				button.classList.toggle('has-custom-icon', loaded);
			}

			function scrollMessagesToBottom() {
				window.requestAnimationFrame(() => {
					messages.scrollTo({
						top: messages.scrollHeight,
						behavior: 'smooth'
					});
					window.setTimeout(() => {
						messages.scrollTop = messages.scrollHeight;
					}, 120);
				});
			}

			function updateChatLayout() {
				const hasConversation = history.length > 0 || messages.children.length > 1;
				panel.classList.toggle('chatting', hasConversation);
			}

			function setOpen(isOpen) {
				panel.classList.toggle('open', isOpen);
				button.setAttribute('aria-expanded', String(isOpen));
				if (isOpen) {
					initWidget();
					window.setTimeout(() => input.focus(), 120);
					scrollMessagesToBottom();
				}
			}

			function appendMessage(role, text) {
				const item = document.createElement('div');
				item.className = `ai-message ${role}`;
				item.textContent = text;
				messages.appendChild(item);
				updateChatLayout();
				scrollMessagesToBottom();
				return item;
			}

			function renderSuggestions(items) {
				suggestions.innerHTML = '';
				if (panel.classList.contains('chatting')) {
					return;
				}
				(items || []).slice(0, 4).forEach(question => {
					const chip = document.createElement('button');
					chip.type = 'button';
					chip.className = 'ai-suggestion-chip';
					chip.textContent = question;
					chip.disabled = sending;
					chip.addEventListener('click', () => sendMessage(question));
					suggestions.appendChild(chip);
				});
			}

			function setStatus(text, offline) {
				status.textContent = text;
				status.classList.toggle('offline', Boolean(offline));
			}

			function showTyping() {
				hideTyping();
				typingMessage = appendMessage('assistant typing', 'AI 상담사가 답변을 준비하고 있습니다...');
			}

			function hideTyping() {
				if (typingMessage) {
					typingMessage.remove();
					typingMessage = null;
					updateChatLayout();
				}
			}

			function setSending(next) {
				sending = next;
				sendButton.disabled = next;
				input.disabled = next;
				Array.from(suggestions.querySelectorAll('button')).forEach(chip => {
					chip.disabled = next;
				});
			}

			async function initWidget() {
				if (initialized) {
					return;
				}

				initialized = true;
				try {
					const response = await fetch('/api/v1/chatbot/ai/init');
					if (!response.ok) {
						throw new Error('init failed');
					}

					const data = await response.json();
					setStatus(data.available ? `${data.provider} 상담 가능` : '환경 설정 확인 필요', !data.available);
					appendMessage('assistant', data.greeting);
					renderSuggestions(data.suggestedQuestions);
				} catch (error) {
					setStatus('연결 지연', true);
					appendMessage('assistant', 'AI 상담 준비 중 문제가 발생했습니다. 잠시 후 다시 열어 주세요.');
				}
			}

			async function sendMessage(rawMessage) {
				const message = (rawMessage || '').trim();
				if (!message || sending) {
					return;
				}

				appendMessage('user', message);
				history.push({ role: 'user', text: message });
				input.value = '';
				updateChatLayout();
				setSending(true);
				showTyping();

				try {
					const response = await fetch('/api/v1/chatbot/ai/message', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							message,
							history: history.slice(-6)
						})
					});

					hideTyping();

					if (!response.ok) {
						throw new Error('message failed');
					}

					const data = await response.json();
					appendMessage('assistant', data.answer);
					history.push({ role: 'assistant', text: data.answer });
					history = history.slice(-8);
					renderSuggestions(data.suggestedQuestions);
					setStatus(data.available ? `${data.provider} 상담 가능` : '환경 설정 확인 필요', !data.available);
				} catch (error) {
					hideTyping();
					appendMessage('assistant', '답변을 가져오는 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.');
					setStatus('연결 지연', true);
				} finally {
					setSending(false);
					input.focus();
				}
			}

			button.addEventListener('click', () => {
				setOpen(!panel.classList.contains('open'));
			});

			if (widgetIcon) {
				widgetIcon.addEventListener('load', syncWidgetIconState);
				widgetIcon.addEventListener('error', () => {
					button.classList.remove('has-custom-icon');
				});
				syncWidgetIconState();
			}

			closeButton.addEventListener('click', () => setOpen(false));

			form.addEventListener('submit', event => {
				event.preventDefault();
				sendMessage(input.value);
			});

			document.addEventListener('keydown', event => {
				if (event.key === 'Escape' && panel.classList.contains('open')) {
					setOpen(false);
				}
			});
		})();
	</script>

</body>
</html>
